    <script>
        function before(element) {
            element.style.boxShadow = "0 4px 20px rgba(0, 0, 0, 0.2)";
            element.style.borderRadius = "30px";
            element.style.transition = "0.3s ease-in-out";

            element.style.borderRadius = "5px";
