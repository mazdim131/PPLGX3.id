    <!-- modal jam mapel -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-tittle" id="exampleModalLabel"
                        style="font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; font-weight: none; font-size: 15px;">
                        Jam pelajaran saat ini
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="statusPelajaran" style="font-size: 20px; font-weight: bold; margin-top: 20px;"></div>
                    <div id="tanggalWIB" style="font-size: 20px; font-weight: bold; margin-top: 20px;"></div>
                </div>
                <div class="modal-footer">
                </div>
            </div>
        </div>
    </div>

    <!-- toast koneksi -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="connectionToast" class="toast align-items-center text-white border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage">
                    Sedang mengecek koneksi...
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"

        <button type="button" class="d-flex margin-left: auto; justify-content-end" data-bs-target="#exampleModal2"
            data-bs-toggle="modal" title="Tambahkan Catatan">
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-plus-circle"

                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />

                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                            width="350" height="620" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
                    </div>
                    <div class="modal-footer">
                    </div>
                </div>
            </div>
        </div>
